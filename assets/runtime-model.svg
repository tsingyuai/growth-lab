<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Growth Lab runtime model</title>
  <desc id="desc">Codex or Claude Code controls skills, client tools, product context, and filesystem memory inside one workspace.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081120"/>
      <stop offset="1" stop-color="#11182b"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#7185a8"/>
    </marker>
  </defs>

  <rect width="1200" height="640" rx="24" fill="url(#bg)"/>
  <text x="64" y="68" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700">THE WORKSPACE IS THE APPLICATION</text>
  <text x="64" y="101" fill="#91a4c5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" letter-spacing="1.5">会话控制一切 · 文件承载记忆 · 工具连接世界</text>

  <g fill="none" stroke="#7185a8" stroke-width="3" marker-end="url(#arrow)">
    <path d="M385 255 C430 255 430 288 474 288"/>
    <path d="M815 255 C770 255 770 288 726 288"/>
    <path d="M385 477 C435 477 435 368 474 368"/>
    <path d="M815 477 C765 477 765 368 726 368"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="474" y="210" width="252" height="244" rx="30" fill="url(#core)"/>
    <text x="600" y="270" text-anchor="middle" fill="#dbeafe" font-size="14" letter-spacing="2">CONTROL PLANE</text>
    <text x="600" y="319" text-anchor="middle" fill="#fff" font-size="28" font-weight="750">AI SESSION</text>
    <text x="600" y="354" text-anchor="middle" fill="#e0e7ff" font-size="17">Codex · Claude Code</text>
    <path d="M526 382H674" stroke="#c4b5fd" opacity="0.55"/>
    <text x="600" y="413" text-anchor="middle" fill="#ede9fe" font-size="14">理解 · 判断 · 创作 · 执行</text>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g>
      <rect x="75" y="174" width="310" height="162" rx="22" fill="#111d35" stroke="#60a5fa" stroke-width="2"/>
      <text x="110" y="220" fill="#93c5fd" font-size="14" letter-spacing="2">METHOD</text>
      <text x="110" y="261" fill="#f8fafc" font-size="25" font-weight="700">SKILLS</text>
      <text x="110" y="297" fill="#9fb0cc" font-size="15">目标 · 方法 · 工作指引</text>
    </g>
    <g>
      <rect x="815" y="174" width="310" height="162" rx="22" fill="#171a36" stroke="#a78bfa" stroke-width="2"/>
      <text x="850" y="220" fill="#c4b5fd" font-size="14" letter-spacing="2">CONTEXT</text>
      <text x="850" y="261" fill="#f8fafc" font-size="25" font-weight="700">PRODUCT</text>
      <text x="850" y="297" fill="#9fb0cc" font-size="15">代码 · 文档 · 用户 · 市场</text>
    </g>
    <g>
      <rect x="75" y="396" width="310" height="162" rx="22" fill="#152234" stroke="#2dd4bf" stroke-width="2"/>
      <text x="110" y="442" fill="#5eead4" font-size="14" letter-spacing="2">ACTION</text>
      <text x="110" y="483" fill="#f8fafc" font-size="25" font-weight="700">CLIENTS</text>
      <text x="110" y="519" fill="#9fb0cc" font-size="15">Browser · API · MCP · CLI</text>
    </g>
    <g>
      <rect x="815" y="396" width="310" height="162" rx="22" fill="#122a2b" stroke="#34d399" stroke-width="2"/>
      <text x="850" y="442" fill="#6ee7b7" font-size="14" letter-spacing="2">MEMORY</text>
      <text x="850" y="483" fill="#f8fafc" font-size="25" font-weight="700">FILES</text>
      <text x="850" y="519" fill="#9fb0cc" font-size="15">研究 · 策略 · 内容 · 数据</text>
    </g>
  </g>
</svg>
